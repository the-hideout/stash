name: restart

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # runs every 6 hours at minute 0

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pin@v6.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: install dependencies
        run: npm install

      # This command effectively restarts the app
      - name: restart railway app
        run: npm run deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
